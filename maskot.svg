<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="480" height="560" role="img" aria-label="Kupa, maskot KunciPanen">
  <title>Kupa — maskot KunciPanen</title>
  <style>
    .k{transform-box:view-box}
    .blink{transform-origin:120px 160px;animation:blink 4.2s infinite}
    .wave{transform-origin:56px 172px;animation:wave 1.8s ease-in-out infinite}
    .sprout{transform-origin:120px 54px;animation:sway 3.2s ease-in-out infinite}
    .chili{transform-origin:196px 196px;animation:bob 2.4s ease-in-out infinite}
    .spark{animation:tw 2.2s ease-in-out infinite}
    .spark.b{animation-delay:1.1s}
    @keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
    @keyframes wave{0%,100%{transform:rotate(8deg)}50%{transform:rotate(-22deg)}}
    @keyframes sway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
    @keyframes bob{0%,100%{transform:rotate(0)}50%{transform:rotate(-8deg)}}
    @keyframes tw{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <defs>
    <linearGradient id="mBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD978"/><stop offset="1" stop-color="#F2A52A"/></linearGradient>
    <linearGradient id="mGreen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5CCB86"/><stop offset="1" stop-color="#1F8A4C"/></linearGradient>
    <linearGradient id="mChili" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF6B5B"/><stop offset="1" stop-color="#D6332A"/></linearGradient>
  </defs>

  <!-- bayangan -->
  <ellipse cx="120" cy="266" rx="62" ry="8" fill="#0F3D2E" opacity=".14"/>

  <!-- kilau -->
  <path class="k spark" style="transform-origin:34px 70px" d="M34 58 L37 67 L46 70 L37 73 L34 82 L31 73 L22 70 L31 67 Z" fill="#F2B33D"/>
  <path class="k spark b" style="transform-origin:208px 96px" d="M208 87 L210 94 L217 96 L210 98 L208 105 L206 98 L199 96 L206 94 Z" fill="#4CC27A"/>

  <!-- tunas di atas gembok -->
  <g class="k sprout">
    <path d="M120 58 C120 46 120 40 120 30" stroke="#123A2C" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M120 36 C108 18 90 16 80 22 C86 36 104 42 120 36 Z" fill="url(#mGreen)" stroke="#123A2C" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M120 30 C130 10 150 6 162 12 C156 28 138 34 120 30 Z" fill="url(#mGreen)" stroke="#123A2C" stroke-width="3.5" stroke-linejoin="round"/>
  </g>

  <!-- gagang gembok -->
  <path d="M80 124 V92 a40 40 0 0 1 80 0 V124" fill="none" stroke="#123A2C" stroke-width="24" stroke-linecap="round"/>
  <path d="M80 124 V92 a40 40 0 0 1 80 0 V124" fill="none" stroke="url(#mGreen)" stroke-width="15" stroke-linecap="round"/>
  <path d="M92 84 a30 30 0 0 1 22 -20" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="4" stroke-linecap="round"/>

  <!-- kaki -->
  <ellipse cx="94" cy="250" rx="20" ry="12" fill="#1F8A4C" stroke="#123A2C" stroke-width="4"/>
  <ellipse cx="146" cy="250" rx="20" ry="12" fill="#1F8A4C" stroke="#123A2C" stroke-width="4"/>

  <!-- tangan kanan + cabai -->
  <g class="k chili">
    <path d="M186 186 Q204 194 206 208" fill="none" stroke="#123A2C" stroke-width="15" stroke-linecap="round"/>
    <path d="M186 186 Q204 194 206 208" fill="none" stroke="#F7B740" stroke-width="8" stroke-linecap="round"/>
    <path d="M200 200 C222 196 232 214 226 236 C222 250 214 256 208 252 C214 236 210 222 200 214 Z" fill="url(#mChili)" stroke="#123A2C" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M200 202 C196 196 198 190 204 188" fill="none" stroke="#1F8A4C" stroke-width="5" stroke-linecap="round"/>
    <path d="M214 212 C218 220 218 228 216 236" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="3" stroke-linecap="round"/>
    <circle cx="206" cy="208" r="9" fill="#F7B740" stroke="#123A2C" stroke-width="3.5"/>
  </g>

  <!-- badan gembok -->
  <rect x="46" y="112" width="148" height="134" rx="46" fill="url(#mBody)" stroke="#123A2C" stroke-width="5"/>
  <ellipse cx="86" cy="134" rx="22" ry="9" fill="#fff" opacity=".45" transform="rotate(-18 86 134)"/>

  <!-- tangan kiri melambai -->
  <g class="k wave">
    <path d="M56 172 Q34 160 30 132" fill="none" stroke="#123A2C" stroke-width="15" stroke-linecap="round"/>
    <path d="M56 172 Q34 160 30 132" fill="none" stroke="#F7B740" stroke-width="8" stroke-linecap="round"/>
    <circle cx="30" cy="128" r="11" fill="#F7B740" stroke="#123A2C" stroke-width="3.5"/>
  </g>

  <!-- wajah -->
  <g class="k blink">
    <ellipse cx="97" cy="160" rx="10" ry="13" fill="#1B2A22"/>
    <ellipse cx="143" cy="160" rx="10" ry="13" fill="#1B2A22"/>
    <circle cx="100.5" cy="155" r="3.8" fill="#fff"/>
    <circle cx="146.5" cy="155" r="3.8" fill="#fff"/>
    <circle cx="94" cy="165" r="1.8" fill="#fff" opacity=".7"/>
    <circle cx="140" cy="165" r="1.8" fill="#fff" opacity=".7"/>
  </g>
  <ellipse cx="78" cy="182" rx="11" ry="6.5" fill="#FF7E7E" opacity=".55"/>
  <ellipse cx="162" cy="182" rx="11" ry="6.5" fill="#FF7E7E" opacity=".55"/>
  <path d="M106 180 Q120 200 134 180 Q120 186 106 180 Z" fill="#7A2E1F" stroke="#123A2C" stroke-width="3" stroke-linejoin="round"/>
  <path d="M113 188 Q120 194 127 188 Q120 185 113 188 Z" fill="#FF8A80"/>

  <!-- lubang kunci di perut -->
  <path d="M120 206 C127 206 130 211 130 216 C130 220 128 222 125.5 223.5 L127 233 Q127 235 125 235 H115 Q113 235 113 233 L114.5 223.5 C112 222 110 220 110 216 C110 211 113 206 120 206 Z" fill="#C97D10" opacity=".85"/>
</svg>
